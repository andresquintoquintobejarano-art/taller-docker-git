version: '3.8'

services:
  web_app:
    image: nginx:alpine
    container_name: web_app_backend
    restart: always
    volumes:
      - ./html:/usr/share/nginx/html:ro
    networks:
      - proxy_network

  proxy:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web_app
    networks:
      - proxy_network

networks:
  proxy_network:
    driver: bridge
